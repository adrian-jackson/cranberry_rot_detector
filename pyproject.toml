[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cranberry-rot-detector"
version = "1.0.0"
description = "SAM3 + DINOv2 pipeline that classifies cranberries as ripe or rotted."
requires-python = ">=3.11"
dependencies = [
    # ── Segmentation ──────────────────────────────────────────────────────
    # Pinned to the same commit backend/modal_app.py deploys, so local runs
    # match production. Bump both together when you want a SAM3 update.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@86ed77094094e5cabb16b0414ec60c5ba9ce0a0f",
    "torch==2.3.0",
    "torchvision==0.18.0",

    # ── Classification ────────────────────────────────────────────────────
    # Never `import sklearn` by name, but required: load_svm() unpickles a
    # fitted scikit-learn Pipeline (StandardScaler + SVC), and run_dino()
    # calls .predict_proba() on it. Pinned because pickled sklearn estimators
    # aren't guaranteed compatible across versions.
    "scikit-learn==1.8.0",

    # ── Image I/O ─────────────────────────────────────────────────────────
    "opencv-python>=4.9.0",   # non-headless: local _run_local_test() uses cv2.imshow
    "Pillow>=10.3.0",
    "numpy>=1.26,<2",

    # ── Label / barcode reading (pipeline.read_label) ────────────────────
    # pytesseract also needs the tesseract-ocr binary on PATH:
    #   Windows: https://github.com/UB-Mannheim/tesseract/wiki
    #   Debian/Ubuntu: apt-get install tesseract-ocr libzbar0
    "pytesseract>=0.3.10",
    "pyzbar>=0.1.9",

    # ── API surface (modal_app.py) ────────────────────────────────────────
    "fastapi>=0.111.0",
    "python-multipart>=0.0.9",   # required by FastAPI for file-upload parsing
    "modal",                      # deploy/manage the backend
]

[tool.setuptools.packages.find]
include = ["backend*"]

# ── Installing ────────────────────────────────────────────────────────────
# CUDA-enabled torch/torchvision come from PyTorch's own index, not PyPI, and
# pyproject.toml can't express a per-package index URL. Install those first,
# then everything else:
#
#   pip install torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cu121
#   pip install -e .
#
# CPU-only (e.g. no local GPU, just testing the SAM3/DINO code paths):
#
#   pip install -e .
